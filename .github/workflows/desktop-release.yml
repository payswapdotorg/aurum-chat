# Desktop client release (post-certification opt-in: "real Tauri 2 client
# binaries"). Builds the Aurum Chat desktop power client (clients/desktop)
# on ubuntu-22.04 — the oldest supported LTS, so the binary's glibc works
# on 22.04, 24.04 and newer — and attaches the .deb to a GitHub release.
#
# Manual dispatch:
#   gh workflow run desktop-release.yml -f tag=desktop-v1.0.0
# or the Actions tab → Desktop Release → Run workflow.

name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. desktop-v1.0.0)"
        required: true
        default: "desktop-v1.0.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-deb:
    name: Build the Aurum Chat desktop client (.deb)
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri 2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build the desktop client (.deb)
        working-directory: clients/desktop
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb

      - name: Locate and sanity-check the artifact
        run: |
          set -euo pipefail
          DEB="$(ls clients/desktop/src-tauri/target/release/bundle/deb/*.deb)"
          echo "DEB_PATH=$DEB" >> "$GITHUB_ENV"
          echo "DEB_NAME=$(basename "$DEB")" >> "$GITHUB_ENV"
          echo "--- deb info ---"
          dpkg-deb --info "$DEB"
          echo "--- deb contents (key paths) ---"
          dpkg-deb --contents "$DEB" | grep -E '/(usr/bin|usr/share/applications|usr/share/icons)/' | head -30

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurum-chat-desktop-deb
          path: clients/desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Aurum Chat Desktop ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          body: |
            The **Aurum Chat** desktop power client (Tauri 2) for Ubuntu amd64.

            The web app stays the canonical renderer (W139 ruling); this
            client is a native window shell over the same authoritative
            product deployment.

            ## Install (Ubuntu)

            ```bash
            wget -O ${{ env.DEB_NAME }} \
              https://github.com/payswapdotorg/aurum-chat/releases/download/${{ inputs.tag }}/${{ env.DEB_NAME }}
            sudo apt install ./${{ env.DEB_NAME }}
            ```

            Then launch **Aurum Chat** from your applications menu.

            Source: [`clients/desktop`](https://github.com/payswapdotorg/aurum-chat/tree/main/clients/desktop)
          files: ${{ env.DEB_PATH }}
